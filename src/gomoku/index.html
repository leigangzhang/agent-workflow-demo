<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋</title>
<style>
  :root {
    --board: #f2d9a8;
    --line: #c9a267;
    --ink: #241c12;
    --cell: 2.1rem;
  }

  body {
    margin: 0;
    padding: 1.5rem;
    background: #faf6ee;
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  h1 {
    margin: 0;
    font-size: 1.35rem;
    letter-spacing: 0.12em;
  }

  .status {
    margin: 0;
    min-height: 1.5em;
    font-size: 1rem;
  }

  .board {
    display: grid;
    background: var(--board);
    border: 2px solid var(--line);
    touch-action: manipulation;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(15, var(--cell));
  }

  .cell {
    margin: 0;
    padding: 0;
    width: var(--cell);
    height: var(--cell);
    border: 1px solid var(--line);
    background: transparent;
    position: relative;
    cursor: pointer;
  }

  .cell:hover {
    background: rgba(0, 0, 0, 0.05);
  }

  .cell:focus-visible {
    outline: 2px solid #2b6cb0;
    outline-offset: -2px;
  }

  .cell::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
  }

  .cell[data-player="black"]::after {
    background: #1b1b1b;
  }

  .cell[data-player="white"]::after {
    background: #fbfbfb;
    border: 1px solid #8a8a8a;
  }

  .reset {
    padding: 0.4rem 1.2rem;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }

  .reset:hover {
    background: var(--board);
  }
</style>
</head>
<body>
<main>
  <h1>五子棋</h1>
  <p class="status" data-status role="status" aria-live="polite">黑方落子</p>
  <div class="board" data-board role="grid" aria-label="15 路棋盘"></div>
  <button type="button" class="reset" data-reset>重开</button>
</main>

<script src="rules.js"></script>
<script>
/*
 * The view. It owns the board's markup and nothing else: every click is offered to
 * `Gomoku.place`, and a refusal is simply not rendered, so legality and the outcome stay
 * in the engine. The two-player mode is the whole of v1 — the turn never moves itself.
 */
(function () {
  "use strict";

  var STRINGS = {
    blackToMove: "黑方落子",
    whiteToMove: "白方落子",
    blackWins: "黑方胜",
    whiteWins: "白方胜",
    draw: "和棋",
    black: "黑方",
    white: "白方",
    intersection: "第 {row} 行第 {col} 列",
  };

  var board = document.querySelector("[data-board]");
  var status = document.querySelector("[data-status]");
  var reset = document.querySelector("[data-reset]");
  var cells = [];
  var game = Gomoku.start();

  function nameOf(player) {
    return player === "white" ? STRINGS.white : STRINGS.black;
  }

  function statusText(current) {
    if (current.winner === "draw") {
      return STRINGS.draw;
    }
    if (current.winner !== null) {
      return current.winner === "white" ? STRINGS.whiteWins : STRINGS.blackWins;
    }
    return current.turn === "white" ? STRINGS.whiteToMove : STRINGS.blackToMove;
  }

  function labelFor(index, player) {
    var size = game.size;
    var label = STRINGS.intersection
      .replace("{row}", String(Math.floor(index / size) + 1))
      .replace("{col}", String((index % size) + 1));
    return player === null ? label : label + "，" + nameOf(player);
  }

  function render() {
    status.textContent = statusText(game);
    for (var index = 0; index < cells.length; index += 1) {
      var player = game.board[index];
      cells[index].dataset.player = player === null ? "" : player;
      cells[index].setAttribute("aria-label", labelFor(index, player));
    }
  }

  function build() {
    var size = Gomoku.SIZE;
    var fragment = document.createDocumentFragment();
    for (var row = 0; row < size; row += 1) {
      var line = document.createElement("div");
      line.className = "row";
      line.setAttribute("role", "row");
      for (var col = 0; col < size; col += 1) {
        var cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.setAttribute("role", "gridcell");
        cell.dataset.row = String(row);
        cell.dataset.col = String(col);
        cells.push(cell);
        line.appendChild(cell);
      }
      fragment.appendChild(line);
    }
    board.appendChild(fragment);
  }

  board.addEventListener("click", function (event) {
    var cell = event.target.closest(".cell");
    if (cell === null || !board.contains(cell)) {
      return;
    }
    var moved = Gomoku.place(game, Number(cell.dataset.row), Number(cell.dataset.col));
    if (!moved.ok) {
      return;
    }
    game = moved.game;
    render();
  });

  reset.addEventListener("click", function () {
    game = Gomoku.start();
    render();
  });

  build();
  render();
})();
</script>
</body>
</html>
